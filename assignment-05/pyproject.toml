[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-pipeline"
version = "0.1.0"
description = "Multi-agent insight pipeline over Spotify reviews: code-orchestrated enrichment, verification, grouping, deterministic ranking, and a cited memo"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.80"]
openai = ["openai>=1.60"]
dashboard = ["fastapi>=0.115", "uvicorn>=0.30", "psycopg[binary]>=3.2"]
test = ["pytest>=8,<9"]

[project.scripts]
pipeline = "insight_pipeline.cli:main"

[tool.setuptools]
packages = ["insight_pipeline", "insight_pipeline.backends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
