[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-wiki"
version = "0.1.0"
description = "A personal wiki CLI and harness: local Gemma through Ollama, BM25 retrieval over an Obsidian vault, cited answers"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wiki = "personal_wiki.cli:main"

[tool.setuptools]
packages = ["personal_wiki", "personal_wiki.backends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
